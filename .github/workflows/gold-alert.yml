name: Gold RROF Alert

on:
  schedule:
    # Chạy mỗi 15 phút
    - cron: "*/15 * * * *"
  workflow_dispatch:

# ⚠️ Cần quyền ghi để commit state file
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run Gold Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      # ⚠️ LUÔN chạy kể cả scanner lỗi
      - name: Commit & push state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nếu file chưa tồn tại thì tạo rỗng
          [ -f signal_state.json ] || echo '{}' > signal_state.json

          git add signal_state.json

          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi state, bỏ qua commit."
          else
            git commit -m "chore: update signal state [skip ci]"
            # Rebase trước khi push để tránh conflict
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
